  <main>
    <div class="page-title">
      <div class="container section-head">
        <h1 class="en">MY ART</h1>
        <span class="ja">作品集</span>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <p class="section-lead">てとが描いたイラスト作品をまとめた作品集です。画像をクリックすると大きく表示されます。</p>

        <!--
          ★作品を追加する方法
            1. 作品の画像を images/myart フォルダに入れる（例：art01.png）
               ※ファイル名は半角英数字で、スペースを入れない
            2. 下の「作品のひな形」の <figure> から </figure> までをコピーして、
               <div class="art-grid"> のすぐ下（いちばん上）に貼り付け
            3. 画像のファイル名・タイトル・制作日・使用ツール・コメントを書き換える
            4. 見本の作品（「仮」の付いたもの）は、本物の作品を載せたら消してOK

          ===== 作品のひな形（これをコピーして使う） =====
          <figure class="art-card">
            <a class="art-image" href="images/myart/art01.png"><img src="images/myart/art01.png" alt="作品タイトル"></a>
            <figcaption>
              <h2 class="art-title">作品タイトル</h2>
              <dl class="art-info">
                <dt>制作日</dt><dd>2026.10</dd>
                <dt>ツール</dt><dd>使ったソフトなど</dd>
              </dl>
              <p class="art-comment">作品についてのひとこと</p>
            </figcaption>
          </figure>
          =============================================
        -->
        <div class="art-grid">

          <figure class="art-card">
            <div class="art-image"><div class="placeholder">作品 差し替え予定</div></div>
            <figcaption>
              <h2 class="art-title">作品タイトル<span class="tag-temp">仮</span></h2>
              <dl class="art-info">
                <dt>制作日</dt><dd>未記入</dd>
                <dt>ツール</dt><dd>未記入</dd>
              </dl>
              <p class="art-comment">ここに作品についてのひとことが入ります。</p>
            </figcaption>
          </figure>

          <figure class="art-card">
            <div class="art-image"><div class="placeholder">作品 差し替え予定</div></div>
            <figcaption>
              <h2 class="art-title">作品タイトル<span class="tag-temp">仮</span></h2>
              <dl class="art-info">
                <dt>制作日</dt><dd>未記入</dd>
                <dt>ツール</dt><dd>未記入</dd>
              </dl>
              <p class="art-comment">ここに作品についてのひとことが入ります。</p>
            </figcaption>
          </figure>

          <figure class="art-card">
            <div class="art-image"><div class="placeholder">作品 差し替え予定</div></div>
            <figcaption>
              <h2 class="art-title">作品タイトル<span class="tag-temp">仮</span></h2>
              <dl class="art-info">
                <dt>制作日</dt><dd>未記入</dd>
                <dt>ツール</dt><dd>未記入</dd>
              </dl>
              <p class="art-comment">ここに作品についてのひとことが入ります。</p>
            </figcaption>
          </figure>

        </div>
